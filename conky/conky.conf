conky.config = {
    -- Window settings
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 60,
    minimum_width = 240,
    maximum_width = 240,
    
    -- Graphics settings
    background = false,
    border_width = 1,
    border_inner_margin = 8,
    border_outer_margin = 5,
    
    -- Colors
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'black',
    color1 = 'white',
    color2 = 'gray',
    
    draw_borders = true,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    
    -- Text settings
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=9',
    
    -- Window properties
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'override',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 200,
    own_window_colour = '010101',
    
    -- Performance
    update_interval = 2.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    
    -- Misc
    double_buffer = true,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:size=11:bold}SYSTEM${font}${color}
${color2}${hr}${color}
Uptime: ${alignr}${uptime_short}

${color1}${font JetBrainsMono Nerd Font:size=11:bold}CPU${font}${color}
${color2}${hr}${color}
Usage: ${alignr}${cpu}%
${cpubar 6}
Temp: ${alignr}${hwmon 5 temp 1}°C

${color1}${font JetBrainsMono Nerd Font:size=11:bold}MEMORY${font}${color}
${color2}${hr}${color}
RAM: ${alignr}${memperc}%
${membar 6}
${mem} / ${memmax}

${color1}${font JetBrainsMono Nerd Font:size=11:bold}BATTERY${font}${color}
${color2}${hr}${color}
Charge: ${alignr}${battery_percent BAT0}%
${battery_bar 6 BAT0}
Status: ${alignr}${battery_status BAT0}

${color1}${font JetBrainsMono Nerd Font:size=11:bold}STORAGE${font}${color}
${color2}${hr}${color}
Root: ${alignr}${fs_used_perc /}%
${fs_bar 6 /}
${fs_used /} / ${fs_size /}
]]